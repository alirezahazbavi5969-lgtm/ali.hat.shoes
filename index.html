<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>فروشگاه کفش و کلاه</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Tahoma, Arial, sans-serif;
      background: #f5f5f5;
      color: #111;
      line-height: 1.8;
    }

    header {
      background: #111;
      color: white;
      padding: 25px 20px;
      text-align: center;
    }

    header h1 {
      font-size: 28px;
      margin-bottom: 5px;
    }

    header p {
      color: #ccc;
      font-size: 14px;
    }

    .hero {
      background: white;
      padding: 55px 20px;
      text-align: center;
    }

    .hero h2 {
      font-size: 32px;
      margin-bottom: 12px;
    }

    .hero p {
      color: #666;
      margin-bottom: 25px;
    }

    .button {
      display: inline-block;
      background: #111;
      color: white;
      padding: 12px 28px;
      border-radius: 8px;
      text-decoration: none;
      transition: 0.3s;
    }

    .button:hover {
      background: #333;
    }

    .products {
      max-width: 1100px;
      margin: 35px auto;
      padding: 0 20px;
    }

    .products h2 {
      text-align: center;
      margin-bottom: 25px;
      font-size: 25px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .card {
      background: white;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      text-align: center;
      padding-bottom: 20px;
    }

    .card img {
      width: 100%;
      height: 240px;
      object-fit: cover;
      display: block;
    }

    .card h3 {
      margin: 15px 10px 5px;
      font-size: 18px;
    }

    .card p {
      color: #777;
      font-size: 14px;
      padding: 0 12px;
    }

    .about {
      background: #111;
      color: white;
      text-align: center;
      padding: 45px 20px;
      margin-top: 45px;
    }

    .about p {
      max-width: 650px;
      margin: 12px auto 0;
      color: #ccc;
    }

    footer {
      background: #000;
      color: #aaa;
      text-align: center;
      padding: 20px;
      font-size: 13px;
    }

    @media (max-width: 600px) {
      .hero h2 {
        font-size: 25px;
      }

      .card img {
        height: 220px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>ali.hat.shoes</h1>
    <p>فروشگاه کفش و کلاه</p>
  </header>

  <section class="hero">
    <h2>استایل خودت را انتخاب کن</h2>
    <p>مجموعه‌ای از کفش‌ها و کلاه‌های خاص برای استایل روزمره و متفاوت</p>
    <a href="#products" class="button">مشاهده محصولات</a>
  </section>

  <section class="products" id="products">
    <h2>محصولات ما</h2>

    <div class="grid">

      <div class="card">
        <img src="IMG_20260819_005402.jpg" alt="کفش">
        <h3>کفش</h3>
        <p>مدل‌های خاص و مناسب استایل روزمره</p>
      </div>

      <div class="card">
        <img src="IMG_20260819_005410.jpg" alt
